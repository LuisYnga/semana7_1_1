<div class="container mt-4">
<h1 class="mb-3">{{ titulo }}</h1>
<table class="table table-striped">
<thead>
<tr>
<th>Nombre</th>
<th>Edad</th>
<th>Créditos</th>
<th>Estado</th>
<th>Notas</th>
</tr>
</thead>
<tbody>
<!-- *ngFor: directiva estructural que repite una fila por estudiante
-->
<tr *ngFor="let e of estudiantes">
<td>{{ e.nombre }}</td>
<td>{{ e.edad }}</td>
<td>{{ e.creditos }}</td>
<td>{{ e.estado }}</td>
<td>{{ e.nota }}</td>
<td>
<!-- [class...]: directiva de atributo que cambia el estilo según
el estado -->
<span class="badge"
[class.bg-success]="estado(e.creditos) === 'Matriculado'"
[class.bg-secondary]="estado(e.creditos) !==
'Matriculado'">
{{ estado(e.creditos) }}
</span>
<td>
<!-- [class...]: directiva de atributo que cambia el estilo según
el estado -->
<span class="badge"
[class.bg-success]="punto(e.nota) === 'Desaprovado'"
[class.bg-secondary]="punto(e.nota) !==
'Aprovado'">
{{ punto(e.nota) }}
</span>
</td>
</td>
</tr>
</tbody>
</table>
</div>
